name: Test default inputs (unsigned commits env setup)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action sets GIT_AUTHOR_NAME, GIT_AUTHOR_EMAIL, GIT_COMMITTER_NAME,
      # GIT_COMMITTER_EMAIL env vars before running the nix/node step.
      # We use continue-on-error so we can assert on the env vars even though
      # the action will fail (no Nix installed in the act container).
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing

      # The env vars are set by the "Set environment variables (unsigned commits)"
      # step inside the composite action and are available in subsequent steps.
      - name: Assert GIT_AUTHOR_NAME is set to default
        run: |
          echo "GIT_AUTHOR_NAME: $GIT_AUTHOR_NAME"
          if [ "$GIT_AUTHOR_NAME" != "github-actions[bot]" ]; then
            echo "FAIL: expected GIT_AUTHOR_NAME='github-actions[bot]', got '$GIT_AUTHOR_NAME'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GIT_AUTHOR_EMAIL is set to default
        run: |
          echo "GIT_AUTHOR_EMAIL: $GIT_AUTHOR_EMAIL"
          if [ "$GIT_AUTHOR_EMAIL" != "<github-actions[bot]@users.noreply.github.com>" ]; then
            echo "FAIL: expected GIT_AUTHOR_EMAIL='<github-actions[bot]@users.noreply.github.com>', got '$GIT_AUTHOR_EMAIL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GIT_COMMITTER_NAME is set to default
        run: |
          echo "GIT_COMMITTER_NAME: $GIT_COMMITTER_NAME"
          if [ "$GIT_COMMITTER_NAME" != "github-actions[bot]" ]; then
            echo "FAIL: expected GIT_COMMITTER_NAME='github-actions[bot]', got '$GIT_COMMITTER_NAME'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GIT_COMMITTER_EMAIL is set to default
        run: |
          echo "GIT_COMMITTER_EMAIL: $GIT_COMMITTER_EMAIL"
          if [ "$GIT_COMMITTER_EMAIL" != "<github-actions[bot]@users.noreply.github.com>" ]; then
            echo "FAIL: expected GIT_COMMITTER_EMAIL='<github-actions[bot]@users.noreply.github.com>', got '$GIT_COMMITTER_EMAIL'"
            exit 1
          fi
          echo "PASS"
