name: Test path-to-flake-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a flake in a subdirectory to test path-to-flake-dir
      - name: Create flake files in subdirectory
        run: |
          mkdir -p nix-config
          cat > nix-config/flake.nix << 'EOF'
          {
            description = "Test flake in subdirectory";
            inputs = {
              nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";
            };
            outputs = { self, nixpkgs }: {};
          }
          EOF
          cat > nix-config/flake.lock << 'EOF'
          {
            "nodes": {
              "nixpkgs": {
                "locked": {
                  "lastModified": 1700000000,
                  "narHash": "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixos-unstable",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF

      # Test with path-to-flake-dir pointing to the subdirectory
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          path-to-flake-dir: "nix-config"
          commit-msg: "flake.lock: Update"
          pr-title: "flake.lock: Update"

      - name: Assert action ran with path-to-flake-dir
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because Nix is not installed
          # but it should have accepted the path-to-flake-dir input correctly
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (Nix not installed), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted path-to-flake-dir input and failed at Nix step"
