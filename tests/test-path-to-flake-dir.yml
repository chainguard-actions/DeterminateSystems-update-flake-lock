name: Test path-to-flake-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the 'path-to-flake-dir' input for cases where
      # flake.nix is not at the repository root. The action will fail because Nix
      # is not installed, but it should not fail due to invalid input handling.
      - name: Create a subdirectory to simulate a nested flake
        run: |
          mkdir -p /tmp/nested-flake
          echo "Simulated nested flake directory created"

      - id: action
        uses: .
        continue-on-error: true
        with:
          path-to-flake-dir: "/tmp/nested-flake"
          commit-msg: "flake.lock: Update nested flake"
          pr-title: "flake.lock: Update nested flake"
          branch: "update-nested-flake-test"
          _internal-strict-mode: "false"

      - name: Assert action ran (failed due to missing Nix, not bad inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because Nix is not installed, not because of bad inputs.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action handled path-to-flake-dir input without crashing at input-parsing stage"
