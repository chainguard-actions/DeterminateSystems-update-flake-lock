name: Test path-to-flake-dir input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git config
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Create flake.nix and flake.lock in a subdirectory
        run: |
          mkdir -p nix-config

          cat > nix-config/flake.nix << 'EOF'
          {
            description = "Test flake in subdirectory";
            inputs.nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";
            outputs = { self, nixpkgs }: {};
          }
          EOF

          cat > nix-config/flake.lock << 'EOF'
          {
            "nodes": {
              "nixpkgs": {
                "locked": {
                  "lastModified": 1700000000,
                  "narHash": "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixos-unstable",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF

          git add nix-config/
          git commit -m "Add test flake files in subdirectory"

      - name: Install mock nix binary
        run: |
          mkdir -p "$HOME/.local/bin"
          cat > "$HOME/.local/bin/nix" << 'EOF'
          #!/bin/sh
          echo "Mock nix called with args: $*" >&2
          echo "Mock nix cwd: $(pwd)" >&2
          # Write args and cwd to files for later inspection
          echo "$*" > /tmp/nix_args.txt
          pwd > /tmp/nix_cwd.txt
          # Simulate nix flake update
          if echo "$*" | grep -q "flake"; then
            touch flake.lock
            git add flake.lock 2>/dev/null || true
            git commit --allow-empty -m "flake.lock: Update" 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/nix"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          path-to-flake-dir: "nix-config"
          commit-msg: "flake.lock: Update"
          pr-title: "flake.lock: Update"
          branch: "update_flake_lock_test_subdir"
        continue-on-error: true

      - name: Assert nix was called in the correct directory
        run: |
          echo "Checking nix working directory..."
          if [ -f /tmp/nix_cwd.txt ]; then
            NIX_CWD="$(cat /tmp/nix_cwd.txt)"
            echo "nix cwd: $NIX_CWD"
            if echo "$NIX_CWD" | grep -q "nix-config"; then
              echo "PASS: nix was called in the nix-config subdirectory"
            else
              echo "FAIL: nix was not called in nix-config subdirectory, got: $NIX_CWD"
              exit 1
            fi
          else
            echo "WARN: /tmp/nix_cwd.txt not found - nix may not have been called"
          fi

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
