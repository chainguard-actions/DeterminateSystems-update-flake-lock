name: Test gpg-fingerprint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal flake.lock for the action to process
        run: |
          cat > flake.lock << 'EOF'
          {
            "nodes": {
              "root": {}
            },
            "root": "root",
            "version": 7
          }
          EOF
          cat > flake.nix << 'EOF'
          {
            description = "Test flake";
            inputs = {};
            outputs = { self }: {};
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          sign-commits: "true"
          gpg-private-key: ""
          gpg-fingerprint: "AABBCCDDEEFF00112233445566778899AABBCCDD"
          gpg-passphrase: ""
          branch: update_flake_lock_test_gpg
          pr-title: "test: gpg-fingerprint input"
          commit-msg: "flake.lock: Update (gpg fingerprint test)"
      - name: Assert action ran with gpg-fingerprint input (expected to fail without real GPG key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected without a real GPG key)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded unexpectedly"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
