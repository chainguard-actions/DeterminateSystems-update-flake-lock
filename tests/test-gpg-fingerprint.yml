name: Test gpg-fingerprint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git identity
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - name: Create a minimal flake.nix for the action
        run: |
          cat > flake.nix << 'EOF'
          {
            description = "Test flake";
            inputs = {};
            outputs = { self }: {};
          }
          EOF
          cat > flake.lock << 'EOF'
          {
            "nodes": {
              "root": {}
            },
            "root": "root",
            "version": 7
          }
          EOF
      - id: action
        uses: .
        with:
          sign-commits: "false"
          gpg-fingerprint: "AABBCCDDEEFF00112233445566778899AABBCCDD"
          branch: test-gpg-fingerprint-update
          pr-title: "Test: gpg-fingerprint input"
          _internal-strict-mode: false
        continue-on-error: true
      - name: Assert action accepted gpg-fingerprint input
        run: |
          echo "Action completed (with or without error due to missing Nix)"
          echo "The gpg-fingerprint input was passed successfully to the action"
          echo "PASS: gpg-fingerprint input is accepted by the action"
