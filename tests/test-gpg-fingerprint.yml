name: Test gpg-fingerprint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action accepts gpg-fingerprint input
        id: action
        uses: .
        with:
          gpg-fingerprint: "AABBCCDDEEFF00112233445566778899AABBCCDD"
          sign-commits: "false"
          branch: update_flake_lock_test_gpg
          pr-title: "flake.lock: Update (gpg-fingerprint test)"
          commit-msg: "flake.lock: Update (gpg-fingerprint test)"
          _internal-strict-mode: false
        continue-on-error: true
      - name: Assert action ran with gpg-fingerprint input
        run: |
          echo "Action completed (with or without PR creation)"
          echo "The gpg-fingerprint input was accepted by the action"
          echo "PASS"
