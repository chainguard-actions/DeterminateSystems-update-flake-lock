name: Test gpg-fingerprint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          sign-commits: "true"
          gpg-private-key: ""
          gpg-fingerprint: "AABBCCDDEEFF00112233445566778899AABBCCDD"
          gpg-passphrase: ""
          branch: update_flake_lock_action_gpg_test
          pr-title: "flake.lock: Update (gpg fingerprint test)"
          commit-msg: "flake.lock: Update (gpg fingerprint test)"
      - name: Assert action ran (gpg-fingerprint input accepted, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with gpg-fingerprint input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected — no real GPG key, Nix not installed, or sentinel repo)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
