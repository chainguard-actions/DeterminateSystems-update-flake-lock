name: Test with GPG fingerprint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Pass gpg-fingerprint input (sign-commits is false so GPG import is skipped,
      # but the input is still accepted and passed through to the node script).
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "flake.lock: Update"
          branch: "update_flake_lock_action"
          pr-title: "flake.lock: Update"
          git-author-name: "github-actions[bot]"
          git-author-email: "github-actions[bot]@users.noreply.github.com"
          git-committer-name: "github-actions[bot]"
          git-committer-email: "github-actions[bot]@users.noreply.github.com"
          sign-commits: "false"
          gpg-fingerprint: "ABCDEF1234567890ABCDEF1234567890ABCDEF12"

      - name: Assert GIT_AUTHOR_NAME was set by action env setup
        run: |
          echo "GIT_AUTHOR_NAME: '${GIT_AUTHOR_NAME}'"
          if [ -z "$GIT_AUTHOR_NAME" ]; then
            echo "FAIL: GIT_AUTHOR_NAME is empty — action env setup did not run"
            exit 1
          fi
          echo "PASS: GIT_AUTHOR_NAME is set"

      - name: Assert GIT_COMMITTER_NAME was set by action env setup
        run: |
          echo "GIT_COMMITTER_NAME: '${GIT_COMMITTER_NAME}'"
          if [ -z "$GIT_COMMITTER_NAME" ]; then
            echo "FAIL: GIT_COMMITTER_NAME is empty"
            exit 1
          fi
          echo "PASS: GIT_COMMITTER_NAME is set"

      - name: Assert GIT_AUTHOR_EMAIL contains expected value
        run: |
          echo "GIT_AUTHOR_EMAIL: '${GIT_AUTHOR_EMAIL}'"
          if [[ "$GIT_AUTHOR_EMAIL" != *"github-actions[bot]"* ]]; then
            echo "FAIL: GIT_AUTHOR_EMAIL does not contain 'github-actions[bot]'"
            exit 1
          fi
          echo "PASS"
