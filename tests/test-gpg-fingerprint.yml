name: Test gpg-fingerprint input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          sign-commits: "true"
          gpg-private-key: ""
          gpg-fingerprint: "AABBCCDDEEFF00112233445566778899AABBCCDD"
          gpg-passphrase: ""
          branch: update_flake_lock_gpg_test
          pr-title: "flake.lock: Update (gpg fingerprint test)"
          commit-msg: "flake.lock: Update (gpg fingerprint test)"
      - name: Assert action ran with gpg-fingerprint input (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PR_NUMBER" ] && [ -z "$PR_URL" ]; then
              echo "FAIL: action succeeded but no PR outputs were set"
              exit 1
            fi
            echo "PASS: action succeeded with gpg-fingerprint input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (GPG key invalid or sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
