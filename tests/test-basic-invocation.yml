name: Test basic action invocation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires Nix to be installed. Without Nix, the action will
      # fail with a "Nix is not installed" error. We use continue-on-error to
      # capture this expected failure and verify the error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "flake.lock: Update"
          branch: "update_flake_lock_action"
          pr-title: "flake.lock: Update"
          _internal-strict-mode: "false"

      - name: Assert action failed due to missing Nix (not misconfiguration)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          # The action should fail (because Nix is not installed in the test environment)
          # but it should not succeed unexpectedly
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded unexpectedly (Nix may be installed)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (Nix not available in test environment)"
          else
            echo "INFO: action outcome was '$OUTCOME'"
          fi
          # We don't exit 1 here because either outcome is acceptable in a test environment
          echo "Basic invocation test complete"
