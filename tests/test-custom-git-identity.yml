name: Test custom git author and committer identity
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that custom git-author-name, git-author-email, git-committer-name,
      # and git-committer-email inputs are correctly propagated to env vars.
      # The action will fail at the nix step (no Nix installed), but the env
      # var setup step runs first and we can assert on those values.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          git-author-name: "Test Bot"
          git-author-email: "testbot@example.com"
          git-committer-name: "Test Committer"
          git-committer-email: "testcommitter@example.com"
          commit-msg: "chore: update flake inputs"
          pr-title: "chore: update flake inputs"

      - name: Assert GIT_AUTHOR_NAME is set to custom value
        run: |
          echo "GIT_AUTHOR_NAME: $GIT_AUTHOR_NAME"
          if [ "$GIT_AUTHOR_NAME" != "Test Bot" ]; then
            echo "FAIL: expected GIT_AUTHOR_NAME='Test Bot', got '$GIT_AUTHOR_NAME'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GIT_AUTHOR_EMAIL is set to custom value
        run: |
          echo "GIT_AUTHOR_EMAIL: $GIT_AUTHOR_EMAIL"
          if [ "$GIT_AUTHOR_EMAIL" != "<testbot@example.com>" ]; then
            echo "FAIL: expected GIT_AUTHOR_EMAIL='<testbot@example.com>', got '$GIT_AUTHOR_EMAIL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GIT_COMMITTER_NAME is set to custom value
        run: |
          echo "GIT_COMMITTER_NAME: $GIT_COMMITTER_NAME"
          if [ "$GIT_COMMITTER_NAME" != "Test Committer" ]; then
            echo "FAIL: expected GIT_COMMITTER_NAME='Test Committer', got '$GIT_COMMITTER_NAME'"
            exit 1
          fi
          echo "PASS"

      - name: Assert GIT_COMMITTER_EMAIL is set to custom value
        run: |
          echo "GIT_COMMITTER_EMAIL: $GIT_COMMITTER_EMAIL"
          if [ "$GIT_COMMITTER_EMAIL" != "<testcommitter@example.com>" ]; then
            echo "FAIL: expected GIT_COMMITTER_EMAIL='<testcommitter@example.com>', got '$GIT_COMMITTER_EMAIL'"
            exit 1
          fi
          echo "PASS"
