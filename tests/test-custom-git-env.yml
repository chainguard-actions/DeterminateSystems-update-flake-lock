name: Test custom git author/committer env vars
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          git-author-name: "My Bot"
          git-author-email: "mybot@example.com"
          git-committer-name: "My Bot Committer"
          git-committer-email: "mybot-committer@example.com"
          commit-msg: "flake.lock: Update"
          branch: "update_flake_lock_action"
          pr-title: "flake.lock: Update"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert custom GIT_AUTHOR_NAME
        run: |
          echo "actual: $GIT_AUTHOR_NAME"
          if [ "$GIT_AUTHOR_NAME" != "My Bot" ]; then
            echo "FAIL: expected 'My Bot', got '$GIT_AUTHOR_NAME'"
            exit 1
          fi
          echo "PASS"

      - name: Assert custom GIT_AUTHOR_EMAIL
        run: |
          echo "actual: $GIT_AUTHOR_EMAIL"
          if [ "$GIT_AUTHOR_EMAIL" != "<mybot@example.com>" ]; then
            echo "FAIL: expected '<mybot@example.com>', got '$GIT_AUTHOR_EMAIL'"
            exit 1
          fi
          echo "PASS"

      - name: Assert custom GIT_COMMITTER_NAME
        run: |
          echo "actual: $GIT_COMMITTER_NAME"
          if [ "$GIT_COMMITTER_NAME" != "My Bot Committer" ]; then
            echo "FAIL: expected 'My Bot Committer', got '$GIT_COMMITTER_NAME'"
            exit 1
          fi
          echo "PASS"

      - name: Assert custom GIT_COMMITTER_EMAIL
        run: |
          echo "actual: $GIT_COMMITTER_EMAIL"
          if [ "$GIT_COMMITTER_EMAIL" != "<mybot-committer@example.com>" ]; then
            echo "FAIL: expected '<mybot-committer@example.com>', got '$GIT_COMMITTER_EMAIL'"
            exit 1
          fi
          echo "PASS"
