name: Test custom commit message and PR title
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git config
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Create a minimal flake.nix and flake.lock
        run: |
          cat > flake.nix << 'EOF'
          {
            description = "Test flake";
            inputs.nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";
            outputs = { self, nixpkgs }: {};
          }
          EOF

          cat > flake.lock << 'EOF'
          {
            "nodes": {
              "nixpkgs": {
                "locked": {
                  "lastModified": 1700000000,
                  "narHash": "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixos-unstable",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF

          git add flake.nix flake.lock
          git commit -m "Add test flake files"

      - name: Install mock nix binary
        run: |
          mkdir -p "$HOME/.local/bin"
          # Capture the args passed to nix so we can assert on them
          cat > "$HOME/.local/bin/nix" << 'EOF'
          #!/bin/sh
          echo "Mock nix called with args: $*" >&2
          # Write args to a file for later inspection
          echo "$*" > /tmp/nix_args.txt
          # Simulate nix flake update
          if echo "$*" | grep -q "flake"; then
            touch flake.lock
            git add flake.lock 2>/dev/null || true
            git commit --allow-empty -m "chore: bump nixpkgs to latest" 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod +x "$HOME/.local/bin/nix"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          token: ${{ github.token }}
          commit-msg: "chore: bump nixpkgs to latest"
          pr-title: "chore: bump nixpkgs to latest"
          pr-body: "Automated flake lock update."
          branch: "update_flake_lock_test_custom_msg"
        continue-on-error: true

      - name: Assert nix was called with correct commit message
        run: |
          echo "Checking nix args..."
          if [ -f /tmp/nix_args.txt ]; then
            NIX_ARGS="$(cat /tmp/nix_args.txt)"
            echo "nix args: $NIX_ARGS"
            if echo "$NIX_ARGS" | grep -q "commit-lockfile-summary"; then
              echo "PASS: nix was called with commit-lockfile-summary flag"
            else
              echo "FAIL: nix was not called with commit-lockfile-summary flag"
              exit 1
            fi
            if echo "$NIX_ARGS" | grep -q "bump nixpkgs to latest"; then
              echo "PASS: nix was called with custom commit message"
            else
              echo "FAIL: nix was not called with custom commit message"
              exit 1
            fi
          else
            echo "WARN: /tmp/nix_args.txt not found - nix may not have been called"
          fi

      - name: Assert action completed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
