name: Test custom git author inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that custom git author/committer inputs are accepted.
      # The action will fail at the nix step since Nix is not installed under act,
      # but the env var setup steps should run first and set the git identity.
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          git-author-name: "Test Bot"
          git-author-email: "testbot@example.com"
          git-committer-name: "Test Bot"
          git-committer-email: "testbot@example.com"
          commit-msg: "chore: update flake inputs"
          pr-title: "chore: update flake inputs"
          sign-commits: "false"
          _internal-strict-mode: "false"

      - name: Assert git author env vars were set
        run: |
          echo "GIT_AUTHOR_NAME: $GIT_AUTHOR_NAME"
          echo "GIT_AUTHOR_EMAIL: $GIT_AUTHOR_EMAIL"
          echo "GIT_COMMITTER_NAME: $GIT_COMMITTER_NAME"
          echo "GIT_COMMITTER_EMAIL: $GIT_COMMITTER_EMAIL"
          if [ "$GIT_AUTHOR_NAME" != "Test Bot" ]; then
            echo "FAIL: expected GIT_AUTHOR_NAME='Test Bot', got '$GIT_AUTHOR_NAME'"
            exit 1
          fi
          if [ "$GIT_AUTHOR_EMAIL" != "<testbot@example.com>" ]; then
            echo "FAIL: expected GIT_AUTHOR_EMAIL='<testbot@example.com>', got '$GIT_AUTHOR_EMAIL'"
            exit 1
          fi
          if [ "$GIT_COMMITTER_NAME" != "Test Bot" ]; then
            echo "FAIL: expected GIT_COMMITTER_NAME='Test Bot', got '$GIT_COMMITTER_NAME'"
            exit 1
          fi
          if [ "$GIT_COMMITTER_EMAIL" != "<testbot@example.com>" ]; then
            echo "FAIL: expected GIT_COMMITTER_EMAIL='<testbot@example.com>', got '$GIT_COMMITTER_EMAIL'"
            exit 1
          fi
          echo "PASS: all git identity env vars set correctly"
