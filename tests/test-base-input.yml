name: Test base input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal flake.nix for the action
        run: |
          cat > flake.nix <<'EOF'
          {
            description = "Test flake";
            inputs = {};
            outputs = { self }: {};
          }
          EOF
          cat > flake.lock <<'EOF'
          {
            "nodes": {
              "root": {}
            },
            "root": "root",
            "version": 7
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: act-harness
          branch: update_flake_lock_test_base
          pr-title: "Test: base input"
          commit-msg: "flake.lock: Update (base input test)"
      - name: Assert action ran (base input accepted, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with base input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
