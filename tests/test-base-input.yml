name: Test base input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up minimal flake.nix for testing
        run: |
          cat > flake.nix << 'EOF'
          {
            description = "Test flake";
            inputs = {};
            outputs = { self }: {};
          }
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add flake.nix
          git commit -m "Add test flake.nix" || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: main
          branch: update_flake_lock_test_base
          pr-title: "Test: flake.lock update with base input"
          commit-msg: "flake.lock: Update (test)"
          _internal-strict-mode: false
      - name: Assert action ran with base input
        run: |
          echo "Action completed (with or without error - base input was passed)"
          echo "pull-request-number: ${{ steps.action.outputs.pull-request-number }}"
          echo "PASS: base input was accepted by the action"
