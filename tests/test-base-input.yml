name: Test base input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up git config
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
      - id: action
        uses: .
        continue-on-error: true
        with:
          base: main
          branch: update_flake_lock_test_base
          pr-title: "flake.lock: Update (base test)"
          _internal-strict-mode: false
      - name: Assert action ran (may fail due to missing nix, but base input was accepted)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because nix is not installed,
          # but it should not fail due to invalid input for 'base'.
          # Any outcome (success or failure) is acceptable here as long as
          # the action started and processed the base input.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with base input set"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
