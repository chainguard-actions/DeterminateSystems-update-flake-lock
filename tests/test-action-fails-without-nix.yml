name: Test action fails gracefully without Nix
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify nix is not installed
        run: |
          if command -v nix &>/dev/null; then
            echo "nix is installed, skipping this test"
            echo "NIX_INSTALLED=true" >> $GITHUB_ENV
          else
            echo "nix is not installed, proceeding with test"
            echo "NIX_INSTALLED=false" >> $GITHUB_ENV
          fi

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "flake.lock: Update"
          branch: "update_flake_lock_action"
          pr-title: "flake.lock: Update"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed when nix is not installed
        run: |
          echo "NIX_INSTALLED: $NIX_INSTALLED"
          echo "action outcome: ${{ steps.action.outcome }}"
          if [ "$NIX_INSTALLED" = "false" ]; then
            if [ "${{ steps.action.outcome }}" != "failure" ]; then
              echo "FAIL: expected action to fail when nix is not installed, but outcome was '${{ steps.action.outcome }}'"
              exit 1
            fi
            echo "PASS: action correctly failed when nix is not installed"
          else
            echo "SKIP: nix is installed, cannot test failure scenario"
          fi
