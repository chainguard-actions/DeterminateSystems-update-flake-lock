name: Test push-to-fork input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal flake.nix for the action
        run: |
          cat > flake.nix << 'EOF'
          {
            description = "Test flake";
            inputs = {};
            outputs = { self }: {};
          }
          EOF
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add flake.nix
          git commit -m "Add test flake.nix" || true
      - id: action
        uses: .
        continue-on-error: true
        with:
          push-to-fork: "actionchain-harness/test-fork"
          branch: update_flake_lock_test_fork
          pr-title: "Test: flake.lock update with push-to-fork"
          commit-msg: "flake.lock: Update (push-to-fork test)"
      - name: Assert action ran (push-to-fork input accepted, or failed gracefully)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PR_NUMBER: ${{ steps.action.outputs.pull-request-number }}
          PR_URL: ${{ steps.action.outputs.pull-request-url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "pull-request-number: $PR_NUMBER"
          echo "pull-request-url: $PR_URL"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with sentinel repo, missing Nix, or non-existent fork)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
