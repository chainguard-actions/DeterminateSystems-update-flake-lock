name: Test nix-options input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create minimal flake files
      - name: Create minimal flake files
        run: |
          cat > flake.nix << 'EOF'
          {
            description = "Test flake";
            inputs = {
              nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";
            };
            outputs = { self, nixpkgs }: {};
          }
          EOF
          cat > flake.lock << 'EOF'
          {
            "nodes": {
              "nixpkgs": {
                "locked": {
                  "lastModified": 1700000000,
                  "narHash": "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixos-unstable",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF

      # Test with nix-options to pass extra options to the nix command
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          nix-options: "--extra-experimental-features nix-command"
          commit-msg: "flake.lock: Update"
          pr-title: "flake.lock: Update"

      - name: Assert action ran with nix-options
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because Nix is not installed,
          # but it should have accepted the nix-options parameter correctly
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (Nix not installed), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted nix-options parameter and failed at Nix step"
