name: Test custom inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts custom inputs without crashing at input-parsing.
      # The action will fail because Nix is not installed, but it should not fail
      # due to invalid input handling.
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "chore: update flake inputs"
          pr-title: "chore: update flake inputs"
          pr-body: "Automated flake lock update."
          pr-labels: "dependencies,nix"
          branch: "custom-flake-update-branch"
          git-author-name: "test-bot"
          git-author-email: "test-bot@example.com"
          git-committer-name: "test-bot"
          git-committer-email: "test-bot@example.com"
          nix-options: "--extra-experimental-features nix-command"
          _internal-strict-mode: "false"

      - name: Assert action ran (failed due to missing Nix, not bad inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because Nix is not installed, not because of bad inputs.
          # Either failure or success is acceptable here — what matters is it didn't crash
          # with an unhandled exception at the input-parsing stage.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action handled custom inputs without crashing at input-parsing stage"
