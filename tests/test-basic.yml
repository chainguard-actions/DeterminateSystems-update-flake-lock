name: Test basic usage (no Nix installed)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires Nix (requireNix: "fail"). When Nix is not installed,
      # the action should fail with a clear error rather than an unexpected crash.
      # We use continue-on-error to capture the failure and assert on it.
      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "flake.lock: Update"
          pr-title: "flake.lock: Update"
          branch: "update_flake_lock_action_test"
          _internal-strict-mode: "false"

      - name: Assert action failed due to missing Nix
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because Nix is not installed
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when Nix is not installed, got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when Nix is not installed"
