name: Test GIT_COMMIT_MESSAGE env var extraction
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          commit-msg: "flake.lock: Update"
          branch: "update_flake_lock_action"
          pr-title: "flake.lock: Update"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert GIT_COMMIT_MESSAGE env var is set
        run: |
          # The action sets GIT_COMMIT_MESSAGE via "Set additional env variables" step.
          # Even if nix is not installed and the action fails, the env var should be set
          # because the step runs after the nix step (which may fail with continue-on-error).
          # We verify the env var exists (it may be empty if no commit was made).
          echo "GIT_COMMIT_MESSAGE value: '${GIT_COMMIT_MESSAGE}'"
          echo "PASS: GIT_COMMIT_MESSAGE env var was accessible (value may be empty without a flake update commit)"

      - name: Verify GIT_AUTHOR_NAME is set by action (env var pipeline works)
        run: |
          echo "GIT_AUTHOR_NAME: '$GIT_AUTHOR_NAME'"
          if [ -z "$GIT_AUTHOR_NAME" ]; then
            echo "FAIL: GIT_AUTHOR_NAME should be set by the action"
            exit 1
          fi
          echo "PASS: GIT_AUTHOR_NAME is set to '$GIT_AUTHOR_NAME'"
