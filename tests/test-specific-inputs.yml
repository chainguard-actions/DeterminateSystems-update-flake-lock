name: Test updating specific flake inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test that the action accepts the 'inputs' parameter for updating specific
      # flake inputs. When 'inputs' is set, the action uses 'nix flake lock --update-input'
      # instead of 'nix flake update'. The action will fail because Nix is not installed,
      # but it should not fail due to invalid input handling.
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: "nixpkgs flake-utils"
          commit-msg: "flake.lock: Update nixpkgs and flake-utils"
          pr-title: "flake.lock: Update nixpkgs and flake-utils"
          branch: "update-specific-inputs-test"
          _internal-strict-mode: "false"

      - name: Assert action ran (failed due to missing Nix, not bad inputs)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because Nix is not installed, not because of bad inputs.
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: action was unexpectedly cancelled"
            exit 1
          fi
          echo "PASS: action handled specific inputs parameter without crashing at input-parsing stage"
