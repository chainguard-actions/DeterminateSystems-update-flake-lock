name: Test specific flake inputs update
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create minimal flake files with multiple inputs
      - name: Create flake files with multiple inputs
        run: |
          cat > flake.nix << 'EOF'
          {
            description = "Test flake with multiple inputs";
            inputs = {
              nixpkgs.url = "github:NixOS/nixpkgs/nixos-unstable";
              home-manager = {
                url = "github:nix-community/home-manager";
                inputs.nixpkgs.follows = "nixpkgs";
              };
            };
            outputs = { self, nixpkgs, home-manager }: {};
          }
          EOF
          cat > flake.lock << 'EOF'
          {
            "nodes": {
              "home-manager": {
                "inputs": {
                  "nixpkgs": "nixpkgs"
                },
                "locked": {
                  "lastModified": 1700000000,
                  "narHash": "sha256-BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=",
                  "owner": "nix-community",
                  "repo": "home-manager",
                  "rev": "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb",
                  "type": "github"
                },
                "original": {
                  "owner": "nix-community",
                  "repo": "home-manager",
                  "type": "github"
                }
              },
              "nixpkgs": {
                "locked": {
                  "lastModified": 1700000000,
                  "narHash": "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=",
                  "owner": "NixOS",
                  "repo": "nixpkgs",
                  "rev": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa",
                  "type": "github"
                },
                "original": {
                  "owner": "NixOS",
                  "ref": "nixos-unstable",
                  "repo": "nixpkgs",
                  "type": "github"
                }
              },
              "root": {
                "inputs": {
                  "home-manager": "home-manager",
                  "nixpkgs": "nixpkgs"
                }
              }
            },
            "root": "root",
            "version": 7
          }
          EOF

      # Test updating only specific inputs (nixpkgs only, not home-manager)
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: ${{ github.token }}
          inputs: "nixpkgs"
          commit-msg: "flake.lock: Update nixpkgs"
          pr-title: "flake.lock: Update nixpkgs"
          branch: "update-nixpkgs-only"

      - name: Assert action ran with specific inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail because Nix is not installed,
          # but it should have accepted the specific inputs parameter correctly
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (Nix not installed), but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly accepted specific inputs parameter and failed at Nix step"
